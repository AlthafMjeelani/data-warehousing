services:
  warehouse:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?Required}
      BI_PASSWORD: ${BI_PASSWORD:?Required}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./sql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:v0.56.1
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: warehouse
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      warehouse:
        condition: service_healthy

  pipeline:
    build: .
    env_file: .env
    environment:
      PGHOST: warehouse
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-warehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Required}
      PGDATABASE: ${POSTGRES_DB:-analytics}
      KAKU_SOURCE_PASSWORD: ${KAKU_SOURCE_PASSWORD:-kaku-local-reader}
    volumes:
      - ./config:/app/config:ro
      - ./warehouse:/app/warehouse
    depends_on:
      warehouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  source:
    image: mysql:8.4
    profiles: [demo, dump]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    ports:
      - "127.0.0.1:53306:3306"
    volumes:
      - source_data:/var/lib/mysql
      - ./demo/source.sql:/docker-entrypoint-initdb.d/10-demo.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  kaku-source:
    image: mysql:9.6
    profiles: [kaku]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    volumes:
      - kaku_source_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  warehouse_data:
  source_data:
  kaku_source_data:
