[project]
name = "sales-data-warehouse"
version = "0.1.0"
description = "Multi-company sales warehouse with MySQL ingestion, dbt and Metabase"
requires-python = ">=3.11,<3.14"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "PyMySQL[rsa]>=1.1,<2",
  "dbt-postgres>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingestion*", "dashboards*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
